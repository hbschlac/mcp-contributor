name: weekly-refresh

# Runs refresh.sh on demand and opens an issue if drift, new pages, or gap-high
# items are detected. Manual dispatch only; see the note on the trigger below.

on:
  # The weekly schedule is intentionally removed. It filed 10 identical
  # "drift or gaps detected" issues (#4-#13) that were never actioned, all
  # caused by the same unfixed anchor bug: refresh.sh greps for "## Step 11.N"
  # headings, but SKILL.md's appendix uses "### 11.N", so all 11 subsection
  # anchors miss on every run. GitHub auto-disabled the workflow on 2026-06-21
  # after 60 days of repo inactivity, but any push re-enables it, so the
  # trigger is removed here rather than left to that accident.
  # Run it by hand if you want a drift report; fix the anchors before
  # restoring a schedule.
  workflow_dispatch: {}

permissions:
  contents: read
  issues: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install yq
        run: sudo snap install yq || (curl -L -o /usr/local/bin/yq https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64 && sudo chmod +x /usr/local/bin/yq)

      - name: Run refresh
        id: refresh
        run: |
          bash refresh.sh
          echo "report<<EOF" >> $GITHUB_OUTPUT
          cat refresh-report.md >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
        continue-on-error: true

      - name: Upload report artifact
        uses: actions/upload-artifact@v4
        with:
          name: refresh-report
          path: |
            refresh-report.md
            hashes.json
          retention-days: 30

      - name: Open issue on drift / gaps
        if: steps.refresh.outcome == 'failure'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const report = fs.readFileSync('refresh-report.md', 'utf8');
            const today = new Date().toISOString().slice(0, 10);
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `[refresh ${today}] drift or gaps detected`,
              body: report,
              labels: ['refresh', 'drift'],
            });
